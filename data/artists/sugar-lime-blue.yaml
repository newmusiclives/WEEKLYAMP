artist:
  name: Sugar Lime Blue
  hometown: Nashville, TN
  formation_year: 1999   # When Dave and Ashley Beth first met in Texas; the
                         # band's first official shows were in 2007.
  genre: Americana / blues / folk / country / jam (self-described as "Cosmic Cowgirl")
  current_status: active
  current_label: independent
  last_full_review: 2026-10-30

members:
  - name: Ashley Beth
    role: lead vocals
    era: current (founding)
    notes: Co-founder. Met Dave in Arlington, Texas in 1999 (The Wilson Post, 2015-10-28, https://mainstreetmediatn.com/articles/thewilsonpost/sugar-lime-blue-goes-back-to-the-future/); the band emerged from her singing background vocals on his earlier project. Couple moved to Wilson County, TN in 2004. Ashley + Dave tour as the "SLB Acoustic Duo" — the majority of 2026 dates (https://www.reverbnation.com/sugarlimeblue/events, checked 2026-10-30).
  - name: Dave Beth
    role: lead guitar
    era: current (founding)
    notes: Co-founder. Coined the band name "Sugar Lime Blue" at home with Ashley.
  - name: Matt Fox
    role: bass
    era: current
    notes: Listed as the current bassist on Bandsintown (checked 2026-05-07). NOT re-verified 2026-10-30 — Bandsintown returned 403 and no second source names him. Treat as last-confirmed May 2026.
  - name: Ikaika Pekelo
    role: drums and percussion
    era: current
    notes: Listed as the current drummer on Bandsintown (checked 2026-05-07). NOT re-verified 2026-10-30 — Bandsintown returned 403 and no second source names him. Treat as last-confirmed May 2026.
  - name: Russ Dean
    role: bass
    era: 2010-2020 (passed away 2020)
    notes: Founding-era bassist. Joined ~2010 after relocating from California to Nashville. Bonded with the Beths over a shared love of jam-band music, particularly the Grateful Dead.
  - name: Joe Bass
    role: bass
    era: interim (post-2020)
    notes: Played bass on tour for a period after Russ Dean's passing. Also performs as Brian Howe.

albums:
  - title: Far From The Tree
    year: 2011
    studio: null
    label: independent
    source_url: https://sugarlimeblue.com/music
    verified_on: 2026-05-07
    notes: Debut album.

  - title: Move That Earth
    year: 2015
    studio: null
    label: independent
    source_url: https://sugarlimeblue.bandcamp.com/album/move-that-earth
    verified_on: 2026-10-30
    notes: Sophomore release, 7 tracks. Bandcamp "released August 1, 2015". The Wilson Post (2015-10-28) reported the CD came out in July 2015 and a 300-copy vinyl run was ~90% fan-funded via Kickstarter (https://mainstreetmediatn.com/articles/thewilsonpost/sugar-lime-blue-goes-back-to-the-future/).

  - title: Narcoluptuous
    year: 2019
    studio: Bluebird (the band's home studio, Lebanon, TN)
    label: independent
    source_url: https://sugarlimeblue.bandcamp.com/album/narcoluptuous
    verified_on: 2026-10-30
    notes: Third studio album. 12 tracks. Bandcamp "released May 15, 2019"; credits "Recorded at Bluebird Studios, Lebanon TN" and "Mastered by Jim Haydon Complex One". Also reviewed by Indie Band Guru 2019-10-16 (https://indiebandguru.com/sugar-lime-blue-narcoluptuous/).

  - title: The Blackbird Sessions
    year: 2022
    studio: Blackbird Studio (Nashville, TN)
    label: independent
    source_url: https://sugarlimeblue.com/album/2238676/the-blackbird-sessions
    verified_on: 2026-05-07
    notes: Latest release (no newer single/EP/album found as of 2026-10-30). 9 tracks. Recorded at the iconic Blackbird Studio in Nashville. Picked up by 100+ FM radio stations. Standout tracks include "Burn It" and "Didn't Mean To Kill You" per Indie Band Guru.

