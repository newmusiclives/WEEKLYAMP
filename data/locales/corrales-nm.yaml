scene_facts:
  # STALE 2026-10-30: replaced. Was "Music in Corrales is in its 39th season in
  # 2026 ... under the Corrales Historical Society" - the 2026-27 season is the
  # 40th anniversary, and the presenter is the Corrales Cultural Arts Council.
  - claim: Music in Corrales was created in 1986 by the all-volunteer Corrales Cultural Arts Council; its 2026-27 season (from Sept 19, 2026) is billed as the series' 40th anniversary.
    source_url: https://www.visitalbuquerque.org/event/40th-anniversary-of-music-in-corrales/63711/
    verified_on: 2026-10-30

  - claim: Outpost Performance Space and the New Mexico Jazz Workshop (founded 1976) merged on January 3, 2026, with both operating under the Outpost banner.
    source_url: https://outpostspace.org/
    verified_on: 2026-05-07
    # 2026-10-30: the homepage no longer carries the dated merger text (it shows
    # joint "Outpost & NM Jazz Workshop" branding only). A May 26, 2026 listing
    # calls it "the newly merged New Mexico Jazz Workshop". Treat the exact date
    # as unconfirmed until a current source restates it.

  - claim: On Oct 19, 2026 Outpost Performance Space launched a $5.2M campaign, with $2.5M already raised, to renovate its Yale Blvd building, build the Kaman Music Education Center, expand its outdoor courtyard (funded by SUNNY505) and create the Tom Guralnick Legacy Endowment.
    source_url: https://outpostspace.org/2026/10/19/outpost-launches-5-2m-campaign/
    verified_on: 2026-10-30

  - claim: Casa Vieja occupies an adobe building constructed in 1770 in the village of Corrales.
    source_url: https://oldcasanm.com/
    verified_on: 2026-05-07

  - claim: Frogville Studios in Santa Fe was officially established in 2003.
    source_url: https://frogvilleplanet.com/recording-studio/
    verified_on: 2026-05-07

  - claim: The Sandia Bar at 4445 Corrales Rd was established in 1948 and was run by the Chavez family until 2018; Steve Chavez was the last family operator.
    source_url: https://corralescomment.com/2024/09/12/new-ownership-brings-new-life-to-the-sandia-bar/
    verified_on: 2026-08-12

  - claim: Sandia Bar hosts free live music on its patio Saturdays and Sundays from 2pm to 5pm, listed as a family-friendly daytime slot with no cover.
    source_url: https://www.visitalbuquerque.org/event/weekend-live-music-at-sandia-bar/64066/
    verified_on: 2026-08-12

  # SUPERSEDED 2026-10-30 by the Oct 27 draft facts below; kept as history.
  - claim: As of April 2026 the Village of Corrales has not adopted a new noise ordinance; Mayor Fred Hashimoto said it would be at least a few months, and the village contracted sound engineer Joshua Leasure of Colorado Analytics through Complete Safety Supply to make recommendations.
    source_url: https://corralescomment.com/2026/04/01/the-sound-of-silence-corrales-council-takes-next-step-in-drafting-noise-ordinance/
    verified_on: 2026-08-12

  - claim: Corrales Village Attorney Randy Autio has said the existing noise ordinance, which bars "excessive or unusually loud noise", may not be enforceable because of its vagueness.
    source_url: https://corralescomment.com/2025/07/21/corrales-seeks-public-input-on-noise-ordinance-revision/
    verified_on: 2026-08-12

  - claim: On Oct 27, 2026 the Corrales council discussed "Draft Noise Ordinance v4" (not adopted). Officials intend to bring a revised version back for publication, then a formal public hearing before a final vote, aiming to have rules in place before the spring patio-music season. No hearing date has been set. A new ordinance would most likely take effect 30 days after passage.
    source_url: https://corralescomment.com/2026/10/28/corrales-noise-ordinance/
    verified_on: 2026-10-30

  - claim: Draft Noise Ordinance v4 sets limits measured on the receiving property - residential zones A-1, A-2 and H 55 dBA Leq day / 45 night (60/50 dBC); zones C, O and M 65 dBA day / 55 night (70/60 dBC). Daytime is 7am-10pm Fri-Sat and 7am-9pm Sun-Thu. Live-music measurements run at least five minutes. Plainly audible amplified sound beyond the property line at night can be a violation without a meter reading. Exemptions include officially sanctioned Village events; there is no Corrales Road commercial exemption in v4.
    source_url: https://www.corrales-nm.org/AgendaCenter/ViewFile/Agenda/_10272026-251
    verified_on: 2026-10-30

  - claim: The Corrales Comment reports a municipal judge declared the current noise rule unenforceable after an establishment (not named) was cited for a noise violation; Councilor Zachary Burkett called the v4 draft well written and expects modifications.
    source_url: https://corralescomment.com/2026/10/28/corrales-noise-ordinance/
    verified_on: 2026-10-30

  - claim: The Corrales Arts Center has moved into 4436 Corrales Rd, Suite A1 (a storefront formerly occupied by Casa Vieja), with a members-only opening Nov 13 and a public open house Sun Nov 15, 2026, 1-5pm; president Charlene Spiegel. Membership is open to non-residents and non-artists. No performance or music programming was mentioned.
    source_url: https://corralescomment.com/2026/10/29/corrales-arts-center/
    verified_on: 2026-10-30

  - claim: The 23rd Annual Corrales Starlight Parade, sponsored by Corrales MainStreet, is set for Dec 5, 2026, from Wagner's parking lot south on Corrales Road, with Corrales Road closed 5:15-6:30pm between Tenorio Rd and Coronado Rd (Resolution 26-66, Oct 27 consent agenda).
    source_url: https://www.corrales-nm.org/AgendaCenter/ViewFile/Agenda/_10272026-251
    verified_on: 2026-10-30

  - claim: New Mexico Arts FY28 grants are a fixed $5,000 each (up to ~200 awards) for nonprofits, government units, schools and tribal entities - or groups using a 501(c)(3) fiscal agent; individual artists may not apply. Final online deadline 11:59pm MT Dec 18, 2026 (the guidelines also print Dec 8 in one checklist line). The advance-review deadline for new applicants was Oct 23, 2026.
    source_url: https://nmarts.org/wp-content/uploads/2026/09/FY28-Funding-Guidelines.pdf
    verified_on: 2026-10-30

  - claim: At a July 2025 Corrales work study on noise, Casa Vieja's Dan O'Brien proposed the test "If those folks at that first table can't talk, then it's too loud."
    source_url: https://corralescomment.com/2025/07/31/all-abuzz-about-noise/
    verified_on: 2026-08-12

