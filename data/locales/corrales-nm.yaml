    type: bar
    address: 4445 Corrales Rd, Corrales, NM 87048
    city: Corrales
    drive_minutes_from_locale: 0
    capacity: null
    books_original_music: yes
    booking_contact: https://sandiabar.com/live-music-submission/
    notes: >-
      Established 1948; run by the Chavez family until 2018 and reopened under new
      ownership after Steve Chavez's death, with Lane McIntyre as general manager.
      Renovation nearly doubled the interior and added a patio and rooftop, keeping
      the adobe walls, "truth windows" and vintage Budweiser and Schlitz signs.
      Free live music Saturdays and Sundays 2-5pm on the patio, family-friendly.
      Artists pitch through a web form, not a named buyer. Phone (505) 835-5983.
      Bar Sun-Tues 11a-10p, Wed-Thur 11a-11p, Fri-Sat 11a-12a; restaurant
      Sun-Thur 11a-9p, Fri-Sat 11a-10p. Capacity, PA spec, pay and set length are
      all unpublished - ask before pitching.
