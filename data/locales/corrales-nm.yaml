venues:
  - name: Sandia Bar
    type: bar
    address: 4445 Corrales Rd, Corrales, NM 87048
    city: Corrales
    drive_minutes_from_locale: 0
    capacity: null
    books_original_music: yes
    booking_contact: https://sandiabar.com/live-music-submission/
    notes: >-
      Established 1948; run by the Chavez family until 2018 and reopened under new
      ownership after Steve Chavez's death, with Lane McIntyre as general manager.
      Renovation nearly doubled the interior and added a patio and rooftop, keeping
      the adobe walls, "truth windows" and vintage Budweiser and Schlitz signs.
      Free live music Saturdays and Sundays 2-5pm on the patio, family-friendly
      (Visit Albuquerque listing, still live 2026-10-30, no end date - whether it
      runs through winter is unconfirmed). Artists pitch through a web form, not a
      named buyer. Phone (505) 835-5983 (Yelp; no longer printed on sandiabar.com).
      As of 2026-10-30 sandiabar.com lists BAR "Sun-Thur 11a-10p, Fri-Sat 11a-12p"
      (12p presumably midnight) and RESTAURANT "Sun-Thur 11a-9p, Fri-Sat 11a-10p".
      STALE: the Aug 2026 bar hours (Sun-Tues 11a-10p, Wed-Thur 11a-11p) are gone.
      Lane McIntyre as GM rests on the Sept 2024 article only - not reconfirmed
      2026-10-30 (site names no GM; footer "Sandia Bar LLC"). Events page shows
      live music, trivia and game day tiles with no dates. Capacity, PA spec, pay
      and set length are all unpublished - ask before pitching.
    source_url: https://corralescomment.com/2024/09/12/new-ownership-brings-new-life-to-the-sandia-bar/
    hours_source_url: https://sandiabar.com/
    verified_on: 2026-10-30

