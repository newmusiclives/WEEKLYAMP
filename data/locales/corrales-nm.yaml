scene_facts:
  - claim: Music in Corrales is in its 39th season in 2026, hosted at the Historic Old San Ysidro Church (966 Old Church Rd) under the Corrales Historical Society.
    source_url: https://www.corraleshistory.org/mic.html
    verified_on: 2026-05-07

  - claim: Outpost Performance Space and the New Mexico Jazz Workshop (founded 1976) merged on January 3, 2026, with both operating under the Outpost banner.
    source_url: https://outpostspace.org/
    verified_on: 2026-05-07

  - claim: Casa Vieja occupies an adobe building constructed in 1770 in the village of Corrales.
    source_url: https://oldcasanm.com/
    verified_on: 2026-05-07

  - claim: Frogville Studios in Santa Fe was officially established in 2003.
    source_url: https://frogvilleplanet.com/recording-studio/
    verified_on: 2026-05-07

  - claim: The Sandia Bar at 4445 Corrales Rd was established in 1948 and was run by the Chavez family until 2018; Steve Chavez was the last family operator.
    source_url: https://corralescomment.com/2024/09/12/new-ownership-brings-new-life-to-the-sandia-bar/
    verified_on: 2026-08-12

  - claim: Sandia Bar hosts free live music on its patio Saturdays and Sundays from 2pm to 5pm, listed as a family-friendly daytime slot with no cover.
    source_url: https://www.visitalbuquerque.org/event/weekend-live-music-at-sandia-bar/64066/
    verified_on: 2026-08-12

  - claim: As of April 2026 the Village of Corrales has not adopted a new noise ordinance; Mayor Fred Hashimoto said it would be at least a few months, and the village contracted sound engineer Joshua Leasure of Colorado Analytics through Complete Safety Supply to make recommendations.
    source_url: https://corralescomment.com/2026/04/01/the-sound-of-silence-corrales-council-takes-next-step-in-drafting-noise-ordinance/
    verified_on: 2026-08-12

  - claim: Corrales Village Attorney Randy Autio has said the existing noise ordinance, which bars "excessive or unusually loud noise", may not be enforceable because of its vagueness.
    source_url: https://corralescomment.com/2025/07/21/corrales-seeks-public-input-on-noise-ordinance-revision/
    verified_on: 2026-08-12

  - claim: At a July 2025 Corrales work study on noise, Casa Vieja's Dan O'Brien proposed the test "If those folks at that first table can't talk, then it's too loud."
    source_url: https://corralescomment.com/2025/07/31/all-abuzz-about-noise/
    verified_on: 2026-08-12

