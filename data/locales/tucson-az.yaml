    # the Tucson Kitchen Musicians Association (TKMA) and Art State Arizona.
    # Six stages, 150+ performances, includes a young artist showcase and a
    # songwriting competition.
    # 2026-10-30: homepage lists 2027 dates "April 2-4, 2027", "42 Years
