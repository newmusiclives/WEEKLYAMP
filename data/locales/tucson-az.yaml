scene_facts:
  - claim: Craig Schumacher is a Tucson-based producer and audio engineer who has recorded and mixed albums by Calexico, Devotchka, Neko Case, Giant Sand, The Jayhawks, Friends of Dean Martinez, and Amos Lee.
    source_url: https://en.wikipedia.org/wiki/Craig_Schumacher
    verified_on: 2026-05-07

  - claim: The Tucson Folk Festival is in its 41st year in 2026, taking place April 10-12 at J&aacute;come Plaza in downtown Tucson, presented by the Tucson Kitchen Musicians Association.
    source_url: https://www.tucsonfolkfest.org/
    verified_on: 2026-05-07
    # Past tense as of 2026-10-30 — the 2026 festival has happened.

  - claim: The 2027 Tucson Folk Festival is scheduled for April 2-4, 2027.
    source_url: https://www.tucsonfolkfest.org/
    verified_on: 2026-10-30

  - claim: La Rosa, a concert venue in the former Benedictine Monastery chapel at 800 N Country Club Rd, opened October 10, 2025 with a sold-out show of 750 attendees.
    source_url: https://tucson.com/life-entertainment/local/music/article_edf4339e-f8ec-4dfb-8248-1a33a8fc90b9.html
    verified_on: 2026-10-30

  - claim: The Arts Foundation for Tucson and Southern Arizona's 2027 stART Grant (up to $5,000; individual artists and 501(c)3s in Southern Arizona) closed October 6, 2026.
    source_url: https://artsfoundtucson.org/grant/2027-start-grant/
    verified_on: 2026-10-30

  - claim: Solar Culture Gallery has operated as an art and performance space in a historic art-deco building in downtown Tucson since 1987.
