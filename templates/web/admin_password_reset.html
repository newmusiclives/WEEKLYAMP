<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new password — TrueFans DISPATCH</title>
{% include "partials/site_head.html" %}
    <style>
        .solo-inner.auth { max-width: 460px; }
        .auth h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); }
        .auth form { display: grid; gap: 16px; }
        .auth .alt { text-align: center; }
        .auth .alt a { color: var(--muted); }
        .auth .alt a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <main class="solo" id="main">
        <div class="solo-inner auth">
            <a href="/" class="brand"><span>True<em>Fans</em> Dispatch</span></a>
            <div class="panel">
                <p class="eyebrow">TrueFans DISPATCH</p>
                <h1>Set a new <em>password</em></h1>
                {% if error %}
                <p class="note err" role="alert">{{ error }}</p>
                {% endif %}
                {% if token %}
                <form method="post" action="/login/reset">
                    <input type="hidden" name="token" value="{{ token }}">
                    <label class="field" for="new_password">New password
                        <input type="password" id="new_password" name="new_password" minlength="12" required autofocus>
                    </label>
                    <label class="field" for="confirm_password">Confirm new password
                        <input type="password" id="confirm_password" name="confirm_password" minlength="12" required>
                    </label>
                    <button type="submit" class="btn primary block">Set password</button>
                </form>
                {% else %}
                <p class="actions"><a href="/login/forgot" class="btn ghost block">Request a new reset link</a></p>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
