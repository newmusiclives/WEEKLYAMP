<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — TrueFans DISPATCH</title>
{% include "partials/site_head.html" %}
    <style>
        .solo-inner.auth { max-width: 460px; }
        .auth h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); }
        .auth form { display: grid; gap: 16px; }
        .auth .alt { text-align: center; }
        .auth .alt a { color: var(--muted); }
        .auth .alt a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <main class="solo" id="main">
        <div class="solo-inner auth">
            <a href="/" class="brand"><span>True<em>Fans</em> Dispatch</span></a>
            <div class="panel">
                <p class="eyebrow">Sign in</p>
                <h1>TrueFans <em>DISPATCH</em></h1>
                <p class="muted">for Industry Professionals, Music Artists and Fans</p>
                {% if error %}
                <p class="note err" role="alert">{{ error }}</p>
                {% endif %}
                <form method="post" action="{{ form_action or '/login' }}">
                    {% if csrf_token %}
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                    {% endif %}
                    <label class="field" for="password">Password
                        <input type="password" id="password" name="password" required autofocus>
                    </label>
                    <button type="submit" class="btn primary block">Sign In</button>
                </form>
                <p class="fine alt"><a href="/login/forgot">Forgot password?</a></p>
            </div>
        </div>
    </main>
</body>
</html>
