<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password — TrueFans DISPATCH</title>
{% include "partials/site_head.html" %}
    <style>
        .solo-inner.auth { max-width: 460px; }
        .auth h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); }
        .auth form { display: grid; gap: 16px; }
        .auth .alt { text-align: center; }
        .auth .alt a { color: var(--muted); }
        .auth .alt a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <main class="solo" id="main">
        <div class="solo-inner auth">
            <a href="/" class="brand"><span>True<em>Fans</em> Dispatch</span></a>
            <div class="panel">
                <p class="eyebrow">TrueFans DISPATCH</p>
                <h1>Reset your <em>password</em></h1>
                {% if message %}
                <p class="note ok" role="status">{{ message }}</p>
                {% endif %}
                {% if error %}
                <p class="note err" role="alert">{{ error }}</p>
                {% endif %}
                <form method="post" action="/login/forgot">
                    <label class="field" for="email">Admin email
                        <input type="email" id="email" name="email" required autofocus>
                    </label>
                    <button type="submit" class="btn primary block">Send reset link</button>
                </form>
                <p class="fine alt"><a href="/login">Back to sign in</a></p>
            </div>
        </div>
    </main>
</body>
</html>
