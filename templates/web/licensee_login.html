<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Edition Portal — TrueFans DISPATCH</title>
{% include "partials/site_head.html" %}
    <style>
        .solo-inner.auth { max-width: 460px; }
        .auth h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); }
        .auth form { display: grid; gap: 16px; }
        .auth .alt { text-align: center; }
        .auth .alt a { color: var(--muted); }
        .auth .alt a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <main class="solo" id="main">
        <div class="solo-inner auth">
            <a href="/" class="brand"><span>True<em>Fans</em> Dispatch</span></a>
            <div class="panel">
                <p class="eyebrow">Licensees</p>
                <h1>City Edition <em>Portal</em></h1>
                <p class="muted">Manage your TrueFans city edition</p>
                {% if error %}
                <p class="note err" role="alert">{{ error }}</p>
                {% endif %}
                <form method="POST" action="/licensee/login">
                    <label class="field" for="email">Email
                        <input type="email" id="email" name="email" required autofocus placeholder="you@example.com">
                    </label>
                    <label class="field" for="password">Password
                        <input type="password" id="password" name="password" required>
                    </label>
                    <button type="submit" class="btn primary block">Sign In</button>
                </form>
                <p class="fine alt"><a href="/admin/licensing">Contact us about licensing</a></p>
            </div>
            <p class="fine alt">TrueFans DISPATCH</p>
        </div>
    </main>
</body>
</html>
