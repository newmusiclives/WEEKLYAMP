<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-factor verification — TrueFans DISPATCH</title>
{% include "partials/site_head.html" %}
    <style>
        .solo-inner.auth { max-width: 460px; }
        .auth h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); }
        .auth form { display: grid; gap: 16px; }
        .auth .alt { text-align: center; }
        .auth .alt a { color: var(--muted); }
        .auth .alt a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <main class="solo" id="main">
        <div class="solo-inner auth">
            <a href="/" class="brand"><span>True<em>Fans</em> Dispatch</span></a>
            <div class="panel">
                <p class="eyebrow">TrueFans DISPATCH</p>
                <h1>Two-factor <em>verification</em></h1>
                {% if error %}
                <p class="note err" role="alert">{{ error }}</p>
                {% endif %}
                <form method="post" action="/login/2fa">
                    <label class="field" for="code">6-digit code from your authenticator app
                        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
                    </label>
                    <button type="submit" class="btn primary block">Verify</button>
                </form>
                <p class="fine alt"><a href="/login">Start over</a></p>
            </div>
        </div>
    </main>
</body>
</html>
