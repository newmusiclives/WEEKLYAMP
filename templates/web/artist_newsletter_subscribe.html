<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ newsletter.artist_name }} Newsletter</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
{% include "partials/site_head.html" %}
    <style>
        /* The artist's own brand colour marks the stripe and their name; DISPATCH green stays the action. */
        :root { --brand: {{ newsletter.brand_color or 'var(--accent)' }}; }
        .brand-accent { width: 64px; height: 5px; border-radius: 3px; background: var(--brand); margin-inline: auto; }
        .container h1 { font-size: clamp(2.6rem, 9vw, 4.2rem); overflow-wrap: anywhere; }
        .container h1 span { color: var(--brand); }
        .tagline { color: var(--muted); font-size: 1.1rem; }
        .fan-count strong { color: var(--brand); }
        .subscribe-form { display: grid; gap: 12px; text-align: left; }
        .powered { font: 500 .74rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
        .powered a { color: var(--muted); }
    </style>
</head>
<body>
<main id="main" class="solo">
    <div class="solo-inner centred container">
        <div class="brand-accent" aria-hidden="true"></div>
        <h1><span>{{ newsletter.artist_name }}</span></h1>
        {% if newsletter.tagline %}
        <p class="tagline">{{ newsletter.tagline }}</p>
        {% endif %}
        {% if sub_count > 0 %}
        <p class="fan-count small muted">Join <strong>{{ sub_count }}</strong> fan{{ 's' if sub_count != 1 else '' }} already subscribed</p>
        {% endif %}
        <div id="subscribe-area" class="panel" style="width:100%">
            <form class="subscribe-form" hx-post="/n/{{ newsletter.slug }}/subscribe" hx-target="#subscribe-area" hx-swap="innerHTML">
                <input type="email" name="email" placeholder="Your email address" required aria-label="Email address">
                <input type="text" name="first_name" placeholder="First name (optional)" aria-label="First name (optional)">
                <button type="submit" class="btn primary lg block">Subscribe</button>
            </form>
        </div>
        <div class="powered">
            Powered by <a href="/">TrueFans DISPATCH</a>
        </div>
    </div>
</main>
</body>
</html>
